# SI units throughout: m, N, Pa.

step_file = "part.step"  # relative to this file

[fixed]
faces = ["f_0"]  # STEP face names, as in ADVANCED_FACE('f_0', ...)

[load]
faces = ["f_1"]
# Exactly one of:
force = [0.0, 0.0, -400.0]  # total force [N], spread uniformly over the faces
# torque = [10.0, 0.0, 0.0]  # [N m] about the faces' centroid; also writes their twist to load_faces.json
# pressure = 1e6  # [Pa], normal to the faces, pushing into the part

[mesh]
size_min = 0.001  # [m]
size_max = 0.005  # [m]

[material]  # steel
youngs_modulus = 200e9  # [Pa]
poisson_ratio = 0.3
