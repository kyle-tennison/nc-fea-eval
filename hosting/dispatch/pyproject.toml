[project]
name = "nc-fea-dispatch"
version = "0.1.0"
description = "Campus-side worker: polls the proxy and runs fea-eval jobs in Docker"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "typer>=0.12",
]

[project.scripts]
fea-dispatch = "nc_fea_dispatch.cli:Cli.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
