# /etc/nginx/sites-available/fea-proxy.conf (symlinked into sites-enabled).
# Scoped to this server_name only. `certbot --nginx -d <name> --redirect` adds the TLS block, so bearer
# tokens never cross the wire in clear. sslip.io names resolve to the IP they spell, so no DNS record needed.
server {
    listen 80;
    listen [::]:80;
    server_name 52-37-243-198.sslip.io;

    client_max_body_size 256m;  # result zips from the dispatcher; keep >= FEA_MAX_RESULT_MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
