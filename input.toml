# SI units throughout: m, N, Pa.

step_file = "named-faces.step"  # relative to this file

[fixed]
faces = [99]  # STEP ADVANCED_FACE IDs (x-min end)

[load]
faces = [101]              # x-max end
force = [0.0, 0.0, 400.0]  # total force [N], spread uniformly over the faces

[mesh]
size_min = 0.001  # [m]
size_max = 0.005  # [m]

[material]  # steel
youngs_modulus = 200e9  # [Pa]
poisson_ratio = 0.3
