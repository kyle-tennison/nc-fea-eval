[project]
name = "nc-fea-eval"
version = "0.1.0"
description = "Dead-simple STEP -> gmsh -> dolfinx linear elasticity pipeline"
requires-python = ">=3.12"
# dolfinx, gmsh, numpy, mpi4py and petsc4py are provided by the dolfinx/dolfinx
# Docker image (dolfinx is not on PyPI). Only list what the image lacks.
dependencies = [
    "loguru>=0.7",
    "typer>=0.12",
]

# The GPU direct solver (cuDSS, via nvmath-python) and the CuPy arrays it takes.
# Optional so the pipeline still installs and runs on a machine without CUDA.
[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=14.1",
    "nvmath-python[cu12]>=1.0",
]

[project.scripts]
fea-pipeline = "nc_fea_eval.cli:Cli.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
